app = "prodaza-auto-cz-bot"
primary_region = "ams"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"

# Keep a single always-on machine: Telegram long-polling allows only one getUpdates consumer.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
  count = 1
